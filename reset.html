<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <form onsubmit="resetPassword(event)">

        <h2>Reset Password</h2>

        <input type="password"
               id="newPassword"
               placeholder="New Password"
               required>

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
