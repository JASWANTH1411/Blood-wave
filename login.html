<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood Wave Login</title>

    <!-- ✅ CSS -->
    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <form id="loginForm"
              onsubmit="loginUser(event)">

            <h2>Login</h2>

            <!-- 📧 EMAIL -->
            <input type="email"
                   id="email"
                   placeholder="Email"
                   required>

            <!-- 🔐 PASSWORD -->
            <input type="password"
                   id="password"
                   placeholder="Password"
                   required>

            <!-- ✅ LOGIN BUTTON -->
            <button type="submit">

                Login

            </button>

            <!-- 🔑 FORGOT PASSWORD -->
            <a href="forgot.html">

                Forgot Password?

            </a>

        </form>

    </div>

    <!-- ✅ JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
