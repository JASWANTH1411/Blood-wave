<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood Wave - Register</title>

    <!-- ✅ CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- 🩸 REGISTER BOX -->
    <div class="container">

        <form id="registerForm"
              onsubmit="registerUser(event)">

            <h2>Register</h2>

            <!-- 👤 NAME -->
            <input type="text"
                   placeholder="Name"
                   id="name"
                   required>

            <!-- 📧 EMAIL -->
            <input type="email"
                   placeholder="Email"
                   id="email"
                   required>

            <!-- 🔐 PASSWORD -->
            <input type="password"
                   placeholder="Password"
                   id="password"
                   required>

            <!-- 👥 ROLE -->
            <select id="role" required>

                <option value="">
                    Select Role
                </option>

                <option value="user">
                    User
                </option>

                <option value="donor">
                    Donor
                </option>

            </select>

            <!-- 🩸 BLOOD GROUP -->
            <select id="blood" required>

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>
                <option value="A-">A-</option>

                <option value="B+">B+</option>
                <option value="B-">B-</option>

                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>

                <option value="O+">O+</option>
                <option value="O-">O-</option>

            </select>

            <!-- 🏙️ CITY -->
            <input type="text"
                   placeholder="City"
                   id="city"
                   required>

            <!-- 📮 PINCODE -->
            <input type="text"
                   placeholder="Pincode"
                   id="pincode"
                   required>

            <!-- ✅ REGISTER BUTTON -->
            <button type="submit">

                Register

            </button>

            <!-- 🔑 LOGIN LINK -->
            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </form>

    </div>

    <!-- ✅ JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
