<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <form onsubmit="forgotPassword(event)">

        <h2>Forgot Password</h2>

        <input type="email"
               id="forgotEmail"
               placeholder="Enter Email"
               required>

        <button type="submit">
            Send Reset Link
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
